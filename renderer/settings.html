<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; object-src 'none'; base-uri 'none'">
  <title>设置 - 浏览器多实例管理器</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="container">
    <header>
      <h1>浏览器设置</h1>
      <button id="backToHome" class="btn btn-secondary btn-small back-btn">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <line x1="19" y1="12" x2="5" y2="12"></line>
          <polyline points="12 19 5 12 12 5"></polyline>
        </svg>
        返回主页
      </button>
    </header>

    <section class="settings-section">
      <div class="section-header">
        <h2>自定义浏览器路径</h2>
        <div class="platform-info" id="platformInfo"></div>
      </div>

      <div class="settings-description">
        <p>配置各浏览器的可执行文件路径留空使用系统默认路径</p>
      </div>

      <div id="browserSettingsList" class="browser-settings-list">
        <!-- Browser settings will be loaded here -->
      </div>

      <div class="settings-actions">
        <button id="saveSettings" class="btn btn-primary">保存设置</button>
        <button id="resetSettings" class="btn btn-secondary">重置为默认</button>
      </div>
    </section>

    <section class="settings-section">
      <div class="section-header">
        <h2>显示设置</h2>
      </div>

      <div class="settings-description">
        <p>配置主页配置列表的默认显示方式</p>
      </div>

      <div class="form-group">
        <label>默认视图模式</label>
        <select id="defaultViewMode">
          <option value="list">列表视图</option>
          <option value="grid">网格视图</option>
        </select>
      </div>

      <div class="form-group">
        <label class="checkbox-label" for="checkUpdatesOnStartup">
          <input id="checkUpdatesOnStartup" type="checkbox" disabled>
          <span class="checkbox-custom"></span>
          启动后检查更新
        </label>
      </div>

      <div class="form-group">
        <p>当前版本：<span id="appVersion">加载中</span></p>
        <button id="checkForUpdates" class="btn btn-secondary" type="button" disabled>立即检查更新</button>
        <p id="updateStatus" class="settings-description" role="status"></p>
        <button id="openReleasePage" class="btn btn-primary" type="button" hidden>查看下载</button>
      </div>

      <div class="form-group">
        <label class="checkbox-label" for="closeToTray">
          <input id="closeToTray" type="checkbox" disabled>
          <span class="checkbox-custom"></span>
          关闭窗口时最小化到系统托盘
        </label>
      </div>
    </section>
  </div>

  <script src="view-utils.js"></script>
  <script src="app-settings-controller.js"></script>
  <script src="close-to-tray-binding.js"></script>
  <script src="update-settings-binding.js"></script>
  <script src="update-ui-controller.js"></script>
  <script src="settings.js"></script>
</body>
</html>
