name: Build and Release

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  prepare:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      should_release: ${{ steps.release-state.outputs.should_release }}
      create_tag: ${{ steps.release-state.outputs.create_tag }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Validate release version
        id: version
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('fs');
          const packageJson = JSON.parse(fs.readFileSync('package.json', 'utf8'));
          const packageLock = JSON.parse(fs.readFileSync('package-lock.json', 'utf8'));
          const version = packageJson.version;
          const semver = /^(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)(?:-(?:0|[1-9]\d*|\d*[A-Za-z-][0-9A-Za-z-]*)(?:\.(?:0|[1-9]\d*|\d*[A-Za-z-][0-9A-Za-z-]*))*)?(?:\+[0-9A-Za-z-]+(?:\.[0-9A-Za-z-]+)*)?$/;

          if (version !== packageLock.version || version !== packageLock.packages[''].version) {
            throw new Error('package.json and package-lock.json versions must match');
          }
          if (!semver.test(version)) {
            throw new Error(`Version is not valid SemVer: ${version}`);
          }

          fs.appendFileSync(process.env.GITHUB_OUTPUT, `tag=v${version}\n`);
          NODE

      - name: Determine release state
        id: release-state
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="${{ steps.version.outputs.tag }}"

          if [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
            echo "should_release=false" >> "$GITHUB_OUTPUT"
            echo "create_tag=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [ "$GITHUB_REF" != "refs/heads/main" ]; then
            echo "workflow_dispatch releases must target refs/heads/main" >&2
            exit 1
          fi

          RELEASE_ERROR="$(mktemp)"
          if gh api --silent "repos/$GITHUB_REPOSITORY/releases/tags/$TAG" 2>"$RELEASE_ERROR"; then
            rm -f "$RELEASE_ERROR"
            echo "Release $TAG already exists; skipping publication."
            echo "should_release=false" >> "$GITHUB_OUTPUT"
            echo "create_tag=false" >> "$GITHUB_OUTPUT"
            exit 0
          else
            RELEASE_STATUS=$?
            if [ "$RELEASE_STATUS" -ne 1 ] || ! grep -q "HTTP 404" "$RELEASE_ERROR"; then
              cat "$RELEASE_ERROR" >&2
              rm -f "$RELEASE_ERROR"
              exit "$RELEASE_STATUS"
            fi
          fi
          rm -f "$RELEASE_ERROR"

          TAG_REF="refs/tags/$TAG"
          if git ls-remote --exit-code --tags origin "$TAG_REF" >/dev/null 2>&1; then
            git fetch --no-tags origin "$TAG_REF:$TAG_REF"
            TAG_TYPE="$(git cat-file -t "$TAG")"
            if [ "$TAG_TYPE" != "tag" ]; then
              echo "Unpublished tag $TAG is not annotated." >&2
              exit 1
            fi
            TAG_COMMIT="$(git rev-list -n 1 "$TAG")"
            if [ "$TAG_COMMIT" != "$GITHUB_SHA" ]; then
              echo "Unpublished tag $TAG points to $TAG_COMMIT, not $GITHUB_SHA." >&2
              exit 1
            fi
            echo "Tag $TAG already points at this commit; resuming release."
            echo "should_release=true" >> "$GITHUB_OUTPUT"
            echo "create_tag=false" >> "$GITHUB_OUTPUT"
            exit 0
          else
            TAG_STATUS=$?
            if [ "$TAG_STATUS" -ne 2 ]; then
              echo "Unable to determine whether remote tag $TAG exists." >&2
              exit "$TAG_STATUS"
            fi
          fi

          echo "should_release=true" >> "$GITHUB_OUTPUT"
          echo "create_tag=true" >> "$GITHUB_OUTPUT"

  build-mac:
    needs: prepare
    runs-on: macos-latest
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Build macOS
        if: needs.prepare.outputs.should_release == 'true'
        run: npm run build:mac
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload DMG
        if: needs.prepare.outputs.should_release == 'true'
        uses: actions/upload-artifact@v6
        with:
          name: dmg
          path: dist/*.dmg
          if-no-files-found: error
          retention-days: 5

  build-win:
    needs: prepare
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Build Windows
        if: needs.prepare.outputs.should_release == 'true'
        run: npm run build:win
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload EXE
        if: needs.prepare.outputs.should_release == 'true'
        uses: actions/upload-artifact@v6
        with:
          name: exe
          path: dist/*.exe
          if-no-files-found: error
          retention-days: 5

  release:
    needs: [prepare, build-mac, build-win]
    if: needs.prepare.outputs.should_release == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Download all artifacts
        uses: actions/download-artifact@v6
        with:
          path: artifacts
          merge-multiple: true

      - name: Load validated release state
        shell: bash
        env:
          VALIDATED_TAG: ${{ needs.prepare.outputs.tag }}
          PREPARE_CREATE_TAG: ${{ needs.prepare.outputs.create_tag }}
        run: |
          set -euo pipefail
          # TAG is the validated "v" + version derived from package.json by prepare.
          if [ -z "$VALIDATED_TAG" ]; then
            echo "Prepare did not provide a release tag." >&2
            exit 1
          fi
          if [ "$PREPARE_CREATE_TAG" != "true" ] && [ "$PREPARE_CREATE_TAG" != "false" ]; then
            echo "Prepare returned an invalid create_tag state: $PREPARE_CREATE_TAG" >&2
            exit 1
          fi
          echo "TAG=$VALIDATED_TAG" >> "$GITHUB_ENV"
          echo "PREPARE_CREATE_TAG=$PREPARE_CREATE_TAG" >> "$GITHUB_ENV"

      - name: Create or verify annotated tag
        id: tag-state
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG_REF="refs/tags/$TAG"
          RELEASE_ERROR="$(mktemp)"
          if gh api --silent "repos/$GITHUB_REPOSITORY/releases/tags/$TAG" 2>"$RELEASE_ERROR"; then
            rm -f "$RELEASE_ERROR"
            echo "Release $TAG was published while this run was building; skipping duplicate publication."
            echo "should_create_release=false" >> "$GITHUB_OUTPUT"
            exit 0
          else
            RELEASE_STATUS=$?
            if [ "$RELEASE_STATUS" -ne 1 ] || ! grep -q "HTTP 404" "$RELEASE_ERROR"; then
              cat "$RELEASE_ERROR" >&2
              rm -f "$RELEASE_ERROR"
              exit "$RELEASE_STATUS"
            fi
          fi
          rm -f "$RELEASE_ERROR"

          if git ls-remote --exit-code --tags origin "$TAG_REF" >/dev/null 2>&1; then
            git fetch --no-tags origin "$TAG_REF:$TAG_REF"
            git show-ref --tags --verify --quiet "$TAG_REF"
            TAG_TYPE="$(git cat-file -t "$TAG")"
            if [ "$TAG_TYPE" != "tag" ]; then
              echo "Existing tag $TAG is not annotated." >&2
              exit 1
            fi
            TAG_COMMIT="$(git rev-list -n 1 "$TAG")"
            if [ "$TAG_COMMIT" != "$GITHUB_SHA" ]; then
              echo "Existing tag $TAG points to $TAG_COMMIT, not $GITHUB_SHA." >&2
              exit 1
            fi
            if [ "$PREPARE_CREATE_TAG" = "true" ]; then
              echo "Tag $TAG appeared after prepare and resolves to this commit; safely resuming."
            fi
          else
            TAG_STATUS=$?
            if [ "$TAG_STATUS" -ne 2 ]; then
              echo "Unable to determine whether remote tag $TAG exists." >&2
              exit "$TAG_STATUS"
            fi
            if [ "$PREPARE_CREATE_TAG" != "true" ]; then
              echo "Prepare expected tag $TAG to exist, but it is now absent." >&2
              exit 1
            fi
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git tag -a "$TAG" "$GITHUB_SHA" -m "$TAG"
            git push origin "$TAG"
          fi
          echo "should_create_release=true" >> "$GITHUB_OUTPUT"

      - name: Create GitHub release
        if: steps.tag-state.outputs.should_create_release == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$TAG" artifacts/*.dmg artifacts/*.exe \
            --verify-tag \
            --target "$GITHUB_SHA" \
            --title "$TAG" \
            --generate-notes
